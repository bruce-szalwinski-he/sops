name: Internal Release

on:
  push:
    tags: [ 'v*-he' ]  # Trigger on tags like v3.8.1-he

permissions:
  contents: read

jobs:
  internal-release:
    runs-on: macos-latest  # Use macOS runner for Apple Developer signing

    permissions:
      contents: write # For creating the GitHub release.
      id-token: write # For creating OIDC tokens for signing.

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.24
          cache: false

      - name: Import Developer ID Certificate
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          # Create temporary keychain
          security create-keychain -p temp_keychain_password temp_keychain
          security default-keychain -s temp_keychain
          security unlock-keychain -p temp_keychain_password temp_keychain
          
          # Import Developer ID certificate
          echo "$DEVELOPER_ID_P12_BASE64" | base64 --decode > developer_id.p12
          security import developer_id.p12 -k temp_keychain -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          
          # Allow codesign to access the certificate
          security set-key-partition-list -S apple-tool:,apple: -s -k temp_keychain_password temp_keychain
          
          # Clean up
          rm developer_id.p12

      - name: Run GoReleaser
        id: goreleaser
        uses: goreleaser/goreleaser-action@v5
        with:
          version: latest
          args: release --config .goreleaser-internal.yaml --clean --timeout 1h
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
          APPLE_DEVELOPER_PASSWORD: ${{ secrets.APPLE_DEVELOPER_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ENABLE_NOTARIZATION: "true"

      - name: Clean up keychain
        if: always()
        run: |
          security delete-keychain temp_keychain || true
